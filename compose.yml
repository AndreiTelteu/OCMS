services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "8445:8000"
    volumes:
      - ./:/app
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    depends_on:
      - db
    working_dir: /app
    command:
      - sh
      - -lc
      - |
        set -e
        getent group ${PGID:-1000} >/dev/null 2>&1 || groupadd -g ${PGID:-1000} crm
        id -u app >/dev/null 2>&1 || useradd -u ${PUID:-1000} -g ${PGID:-1000} -m -s /bin/sh app
        usermod -g ${PGID:-1000} app
        chown -R ${PUID:-1000}:${PGID:-1000} /app/storage /app/bootstrap/cache /data /config
        exec setpriv --reuid=${PUID:-1000} --regid=${PGID:-1000} --clear-groups frankenphp php-server --root /app/public --listen :8000
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: mariadb:11
    container_name: ocms-mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT:-33012}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
